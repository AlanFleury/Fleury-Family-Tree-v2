<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleury D1 Restore</title><style>body{font:16px Arial;background:#f4f6f9;color:#182230;margin:0}.box{max-width:760px;margin:40px auto;background:#fff;padding:25px;border-radius:10px}button{padding:10px 15px;margin-top:10px}.primary{background:#2f5fa8;color:#fff;border:0;border-radius:6px}.notice{padding:12px;background:#eef4ff;margin:15px 0}#status{white-space:pre-wrap;margin-top:15px}.ok{color:#087443}.bad{color:#b42318}.bar{height:18px;background:#ddd;border-radius:9px;margin-top:15px}.bar span{display:block;height:100%;width:0;background:#2f5fa8;border-radius:9px}</style></head><body><div class="box"><h1>Private Archive Restore</h1><p>Administrator-only D1 restore.</p><div class="notice"><b>Expected:</b> 17,972 people and 30,079 relationships. The users table is not changed.</div><input id="file" type="file" accept=".sql,text/plain"><br><button id="go" class="primary" disabled>Restore archive</button><div class="bar"><span id="bar"></span></div><div id="status">Checking administrator access…</div></div>
<script src="./config.js"></script><script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script><script src="./archive-api.js"></script>
<script>
(()=>{const F=document.getElementById('file'),G=document.getElementById('go'),S=document.getElementById('status'),B=document.getElementById('bar');let token=null,ready=false;
function vals(s){let a=[],x='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==="'"&&s[i+1]==="'"){x+="'";i++;continue}if(c==="'"){q=false;continue}x+=c}else{if(c==="'"){q=true;continue}if(c===','){a.push(x.trim()==='NULL'?null:x.trim());x='';continue}x+=c}}a.push(x.trim()==='NULL'?null:x.trim());return a}
function parse(t){let p=[],r=[],m=[];for(let l of t.split(/\r?\n/)){let z=l.match(/VALUES \((.*)\);$/);if(!z)continue;let v=vals(z[1]);if(l.startsWith('INSERT INTO people '))p.push({person_id:v[0],name:v[1],gender:v[2],birth:v[3],death:v[4],relationship_to_alan:v[5],evidence_status:v[6],source_ids:v[7],notes:v[8],places:v[9],json_extra:v[10]});else if(l.startsWith('INSERT INTO relationships '))r.push({type:v[0],person1:v[1],person2:v[2]});else if(l.startsWith('INSERT INTO meta '))m.push({key:v[0],value:v[1]})}return{p,r,m}}
async function call(path,body){let res=await fetch(FLEURY_CONFIG.API_BASE_URL+path,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw Error('API '+res.status+': '+await res.text());return res.json()}
(async()=>{try{let u=await archiveApi.initAuth();if(!u){S.textContent='Opening the secure archive sign-in…';const ac0=await auth0.createAuth0Client({domain:FLEURY_CONFIG.AUTH0_DOMAIN,clientId:FLEURY_CONFIG.AUTH0_CLIENT_ID,authorizationParams:{audience:FLEURY_CONFIG.AUTH0_AUDIENCE,scope:'openid profile email',redirect_uri:location.origin+location.pathname}});await ac0.loginWithRedirect({authorizationParams:{audience:FLEURY_CONFIG.AUTH0_AUDIENCE,scope:'openid profile email',redirect_uri:location.origin+location.pathname}});return}if(await archiveApi.getMyRole()!=='admin'){S.textContent='Administrator access required.';return}let ac=await auth0.createAuth0Client({domain:FLEURY_CONFIG.AUTH0_DOMAIN,clientId:FLEURY_CONFIG.AUTH0_CLIENT_ID,authorizationParams:{audience:FLEURY_CONFIG.AUTH0_AUDIENCE}});token=await ac.getTokenSilently({authorizationParams:{audience:FLEURY_CONFIG.AUTH0_AUDIENCE}});ready=true;G.disabled=false;S.textContent='Administrator verified. Select the restore file.'}catch(e){S.textContent='Cannot start: '+e.message}})();
F.onchange=()=>{G.disabled=!ready||!F.files.length;S.textContent=F.files.length?'Ready: '+F.files[0].name:'Select the restore file.'};
async function send(k,a){for(let i=0;i<a.length;i+=200){await call('/api/archive/import/batch',{kind:k,rows:a.slice(i,i+200)});S.textContent='Importing '+k+': '+Math.min(i+200,a.length).toLocaleString()+' / '+a.length.toLocaleString();B.style.width=(k==='people'?Math.min(50,(i+200)/17972*50):k==='relationships'?50+Math.min(49,(i+200)/30079*49):100)+'%'}}
async function parseFile(file){const text=await file.text();const lines=text.split(/\r?\n/),p=[],r=[],m=[];for(let i=0;i<lines.length;i++){const l=lines[i];let z=l.match(/VALUES \((.*)\);$/);if(z){let v=vals(z[1]);if(l.startsWith('INSERT INTO people '))p.push({person_id:v[0],name:v[1],gender:v[2],birth:v[3],death:v[4],relationship_to_alan:v[5],evidence_status:v[6],source_ids:v[7],notes:v[8],places:v[9],json_extra:v[10]});else if(l.startsWith('INSERT INTO relationships '))r.push({type:v[0],person1:v[1],person2:v[2]});else if(l.startsWith('INSERT INTO meta '))m.push({key:v[0],value:v[1]})}if(i%500===0){S.textContent='Reading restore file: '+i.toLocaleString()+' / '+lines.length.toLocaleString();await new Promise(resolve=>setTimeout(resolve,0));}}return{p,r,m}}
G.onclick=async()=>{if(!ready||!F.files.length)return;G.disabled=true;F.disabled=true;try{S.textContent='Reading restore file…';let d=await parseFile(F.files[0]);if(d.p.length!==17972||d.r.length!==30079)throw Error('Wrong file: found '+d.p.length+' people and '+d.r.length+' relationships.');S.textContent='Clearing incomplete archive…';await call('/api/archive/import/start',{});await send('people',d.p);await send('relationships',d.r);await send('meta',d.m);S.textContent='Verifying…';let v=await call('/api/archive/import/finish',{});if(!v.ok)throw Error('Verification failed: '+v.people+' people, '+v.relationships+' relationships');B.style.width='100%';S.innerHTML='<span class="ok"><b>RESTORE COMPLETE.</b> '+v.people.toLocaleString()+' people and '+v.relationships.toLocaleString()+' relationships.</span>'}catch(e){S.innerHTML='<span class="bad"><b>RESTORE FAILED:</b> '+e.message+'</span>';F.disabled=false;G.disabled=false}};</script></body></html>
