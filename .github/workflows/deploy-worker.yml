name: Deploy Fleury Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure private backup bucket exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: r2 bucket list
      - name: Create private backup bucket if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if npx wrangler r2 bucket list | grep -q 'fleury-family-private-backups-alan'; then
            echo "Private backup bucket already exists."
          else
            npx wrangler r2 bucket create fleury-family-private-backups-alan
          fi
      - name: Deploy Worker with daily backup schedule
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy worker.js --name fleury-family-api --config wrangler.jsonc

