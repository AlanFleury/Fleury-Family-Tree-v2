name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - safe-bulk-admin-recovery

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and static safety checks
        run: node scripts/quality-check.mjs
